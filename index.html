<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>すうずブロック｜TKK 特別支援教材開発研究所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{
    --block-size: clamp(44px, 11vmin, 76px);
    --orange: #f97c2b;
    --orange-light: #ffa05c;
    --orange-dark: #d95f10;
    --blue: #4aa8e0;
    --blue-light: #7cc6f0;
    --blue-dark: #2b86bd;
    --yellow: #f7c948;
    --yellow-light: #ffe08a;
    --yellow-dark: #e0a91e;
    --yellow-ink: #6b4e0e;
    --bg: #fdfbf6;
    --ink: #4a4038;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','BIZ UDGothic',sans-serif;
    background:var(--bg);
    background-image:radial-gradient(#e8e2d6 1.5px, transparent 1.5px);
    background-size:28px 28px;
    color:var(--ink);
    user-select:none; -webkit-user-select:none; touch-action:none;
  }

  #board{ position:fixed; inset:0; touch-action:none; }

  /* ===== 1のブロック ===== */
  .block{
    position:absolute;
    width:var(--block-size); height:var(--block-size);
    border-radius:14%;
    background:linear-gradient(145deg, var(--orange-light) 0%, var(--orange) 55%, var(--orange-dark) 100%);
    box-shadow:
      inset 0 3px 4px rgba(255,255,255,.55),
      inset 0 -4px 6px rgba(0,0,0,.18),
      0 3px 6px rgba(74,64,56,.25);
    cursor:grab; touch-action:none;
    transition:transform .12s ease, background .18s ease;
    will-change:left, top;
  }
  .block.blue{
    background:linear-gradient(145deg, var(--blue-light) 0%, var(--blue) 55%, var(--blue-dark) 100%);
  }
  /* 10でくっついたブロック(黄色) */
  .block.grouped{
    background:linear-gradient(145deg, var(--yellow-light) 0%, var(--yellow) 55%, var(--yellow-dark) 100%);
  }

  .block.dragging{
    transform:scale(1.1);
    box-shadow:
      inset 0 3px 4px rgba(255,255,255,.55),
      inset 0 -4px 6px rgba(0,0,0,.18),
      0 12px 20px rgba(74,64,56,.3);
    cursor:grabbing; z-index:100; transition:none;
  }
  @keyframes pop{ 0%{transform:scale(0);} 70%{transform:scale(1.12);} 100%{transform:scale(1);} }
  .block.pop{ animation:pop .25s ease-out; }
  @keyframes lockpop{ 0%{transform:scale(1);} 45%{transform:scale(1.16);} 100%{transform:scale(1);} }
  .block.lockpop{ animation:lockpop .28s ease-out; }
  @keyframes gobble{ to{ transform:scale(0) rotate(90deg); opacity:0; } }
  .block.gobble{ animation:gobble .22s ease-in forwards; }

  /* 「10」ラベル */
  .ten-label{
    position:absolute; transform:translate(-50%,-50%);
    background:#fff; color:var(--yellow-ink);
    font-weight:800; font-size:calc(var(--block-size)*0.5);
    padding:3px 15px; border-radius:999px;
    border:3px solid var(--yellow-dark);
    box-shadow:0 4px 10px rgba(74,64,56,.22);
    pointer-events:none; z-index:150; white-space:nowrap;
    animation:labelpop .32s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes labelpop{
    0%{ transform:translate(-50%,-50%) scale(0); }
    70%{ transform:translate(-50%,-50%) scale(1.18); }
    100%{ transform:translate(-50%,-50%) scale(1); }
  }

  /* ===== かずの表示 ===== */
  #counter{
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px;
    background:#fff; border:3px solid #e8e2d6; border-radius:999px;
    padding:6px 10px 6px 22px; box-shadow:0 3px 8px rgba(74,64,56,.12); z-index:200;
  }
  #countNum{
    font-size:clamp(28px, 5.5vmin, 44px); font-weight:800;
    min-width:1.6em; text-align:center; line-height:1; color:var(--ink);
  }
  #countNum.hidden-num{ color:#cfc8bc; }
  #counter small{ font-size:clamp(14px,2.5vmin,18px); font-weight:500; color:#9a8f82; }
  #eyeBtn{
    border:none; background:#f3efe6; border-radius:999px;
    width:44px; height:44px; font-size:22px; cursor:pointer;
    display:grid; place-items:center; transition:background .15s;
  }
  #eyeBtn:active{ background:#e4ddcd; }

  /* ===== 10こモード ボタン ===== */
  #modeBtn{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    border:2px solid #e8e2d6; background:#fff; color:#9a8f82;
    border-radius:999px; font-family:inherit; font-weight:800;
    font-size:clamp(14px,2.6vmin,17px); padding:11px 18px;
    cursor:pointer; z-index:200; transition:all .15s;
    box-shadow:0 3px 8px rgba(74,64,56,.12);
  }
  #modeBtn .dot{ width:13px; height:13px; border-radius:50%; background:#d6cdbd; transition:background .15s; }
  #modeBtn.on{ background:var(--yellow); border-color:var(--yellow-dark); color:var(--yellow-ink); }
  #modeBtn.on .dot{ background:var(--yellow-ink); }

  /* ===== ＋ボタン ===== */
  #addBtn{
    position:fixed; left:18px; bottom:18px;
    width:clamp(72px,13vmin,96px); height:clamp(72px,13vmin,96px);
    border:none; border-radius:50%;
    background:linear-gradient(145deg,#ffb36e,var(--orange) 60%,var(--orange-dark));
    color:#fff; font-size:clamp(40px,7vmin,56px); font-weight:800; line-height:1;
    box-shadow:0 5px 0 var(--orange-dark), 0 8px 14px rgba(74,64,56,.3);
    cursor:pointer; z-index:200; transition:transform .08s, box-shadow .08s; font-family:inherit;
  }
  #addBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--orange-dark), 0 3px 6px rgba(74,64,56,.3); }

  /* ===== ゴミばこ ===== */
  #trash{
    position:fixed; right:18px; bottom:18px;
    width:clamp(80px,14vmin,104px); height:clamp(80px,14vmin,104px);
    display:grid; place-items:center; background:#fff;
    border:3px dashed #cfc8bc; border-radius:24px; z-index:90;
    pointer-events:none; transition:transform .15s, border-color .15s, background .15s;
  }
  #trash svg{ width:55%; height:55%; }
  #trash .lid{ transition:transform .15s; transform-origin:78% 30%; }
  #trash.hot{ transform:scale(1.18); border-color:#e8584a; background:#fff1ef; }
  #trash.hot .lid{ transform:rotate(-28deg); }

  /* ===== ぜんぶけす ===== */
  #clearBtn{
    position:fixed; top:14px; right:14px;
    border:none; background:#fff; color:#9a8f82; border:2px solid #e8e2d6;
    border-radius:999px; font-family:inherit; font-weight:500;
    font-size:clamp(13px,2.4vmin,16px); padding:10px 16px;
    cursor:pointer; z-index:200; transition:all .15s;
  }
  #clearBtn.confirm{ background:#e8584a; border-color:#e8584a; color:#fff; font-weight:800; }

  #hint{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    color:#b8ae9e; font-size:clamp(16px,3vmin,22px); font-weight:500;
    text-align:center; line-height:1.9; pointer-events:none; transition:opacity .4s; z-index:1;
  }
  #hint.gone{ opacity:0; }
</style>
</head>
<body>

<div id="board"></div>

<div id="counter">
  <span id="countNum" class="hidden-num">？</span><small>こ</small>
  <button id="eyeBtn" aria-label="かずを みせる">🙈</button>
</div>

<button id="clearBtn">ぜんぶ けす</button>

<button id="modeBtn" aria-pressed="false"><span class="dot"></span>10こモード</button>

<button id="addBtn" aria-label="ブロックを ふやす">＋</button>

<div id="trash" aria-label="ゴミばこ">
  <svg viewBox="0 0 64 64" fill="none">
    <g class="lid">
      <rect x="14" y="14" width="36" height="6" rx="3" fill="#9a8f82"/>
      <rect x="26" y="8" width="12" height="8" rx="3" fill="#9a8f82"/>
    </g>
    <path d="M18 24 h28 l-3 32 a4 4 0 0 1-4 4 H25 a4 4 0 0 1-4-4 z" fill="#b8ae9e"/>
    <rect x="26" y="30" width="4" height="22" rx="2" fill="#fdfbf6"/>
    <rect x="34" y="30" width="4" height="22" rx="2" fill="#fdfbf6"/>
  </svg>
</div>

<div id="hint">＋ボタンを おしてみよう</div>

<script>
(function(){
  const board      = document.getElementById('board');
  const addBtn     = document.getElementById('addBtn');
  const trash      = document.getElementById('trash');
  const counter    = document.getElementById('countNum');
  const counterBox = document.getElementById('counter');
  const eyeBtn     = document.getElementById('eyeBtn');
  const clearBtn   = document.getElementById('clearBtn');
  const modeBtn    = document.getElementById('modeBtn');
  const hint       = document.getElementById('hint');

  let countVisible = false;
  let clearArmed   = false;
  let clearTimer   = null;
  let modeOn       = false;   // 10こモード
  let groupSeq     = 0;

  function block(){
    const el = board.querySelector('.block');
    if (el) return el.offsetWidth;
    const probe = document.createElement('div');
    probe.className = 'block';
    probe.style.visibility = 'hidden';
    board.appendChild(probe);
    const w = probe.offsetWidth;
    probe.remove();
    return w || 64;
  }
  function topSafe(){ return Math.max(counterBox.getBoundingClientRect().bottom + 14, 88); }

  function looseBlocks(){ return Array.from(document.querySelectorAll('.block:not(.grouped):not(.gobble)')); }
  function groupMembers(gid){ return Array.from(document.querySelectorAll('.block.grouped[data-group="'+gid+'"]')); }
  function total(){ return document.querySelectorAll('.block:not(.gobble)').length; }
  function updateCount(){ counter.textContent = countVisible ? total() : '？'; }

  /* ----- ふつうモードの ならびかた(5こずつ) ----- */
  function loosePos(i){
    const s = block();
    const gap = s*0.18, groupGap = s*0.5, step = s+gap, groupSpan = 5*step + groupGap;
    const left = 16, top = topSafe();
    const rightSafe = window.innerWidth - s - 16;
    const bottomSafe = window.innerHeight - s - 132;
    const groupsPerRow = Math.max(1, Math.floor((rightSafe - left + groupGap) / groupSpan));
    const perRow = groupsPerRow * 5;
    const row = Math.floor(i/perRow), j = i%perRow, g = Math.floor(j/5);
    let x = left + (j%5)*step + g*groupSpan;
    let y = top + row*(s + gap*2.2);
    if (y > bottomSafe){
      y = top + (i * s * 0.4) % Math.max(bottomSafe - top, 1);
      x = left + (i * s * 0.3) % Math.max(rightSafe - left, 1) + (j%5)*step*0.2;
    }
    return {x, y};
  }

  /* ----- 10こモードの ならびかた(はなして バラバラに) ----- */
  function scatterPos(i){
    const s = block();
    const step = s*1.8;
    const left = 16, top = topSafe();
    const rightSafe = window.innerWidth - s - 16;
    const bottomSafe = window.innerHeight - s - 132;
    const perRow = Math.max(1, Math.floor((rightSafe - left) / step) + 1);
    const row = Math.floor(i/perRow), col = i%perRow;
    let x = left + col*step, y = top + row*step;
    if (y > bottomSafe){
      y = top + ((i * Math.round(s*0.9)) % Math.max(bottomSafe - top, 1));
      x = left + ((i * Math.round(s*1.3)) % Math.max(rightSafe - left, 1));
    }
    return {x, y};
  }

  /* ----- くっついているか(すきま はんてい) ----- */
  function adjacent(a, b, thresh){
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const gx = Math.max(0, ra.left - rb.right, rb.left - ra.right);
    const gy = Math.max(0, ra.top - rb.bottom, rb.top - ra.bottom);
    return gx <= thresh && gy <= thresh;
  }

  /* ----- ある ブロックと くっついている なかま(BFS) ----- */
  function componentOf(start){
    const thresh = block() * 0.1;
    const all = looseBlocks();
    const seen = new Set([start]);
    const q = [start], out = [start];
    while (q.length){
      const cur = q.shift();
      for (const o of all){
        if (seen.has(o)) continue;
        if (adjacent(cur, o, thresh)){ seen.add(o); q.push(o); out.push(o); }
      }
    }
    return out;
  }

  /* ----- 磁石スナップ:ちかづいたら となりの ブロックに ピタッと ----- */
  // reach ぶんまで ちかづくと、辺が そろう いちへ すいつく(すきま0)
  const SNAP_REACH = 0.5;   // マスたんい(はんぶんマスまで ちかづくと すいつく)
  function slotTaken(cx, cy, s, ignore){
    const ccx = cx + s/2, ccy = cy + s/2;
    return looseBlocks().some(o => {
      if (o === ignore) return false;
      return Math.hypot((o.offsetLeft + s/2) - ccx, (o.offsetTop + s/2) - ccy) < s*0.4;
    });
  }
  function magnetSnap(el, x, y){
    const s = block();
    const reach = s * SNAP_REACH;
    const others = looseBlocks().filter(o => o !== el);
    let best = null, bestD = reach;
    for (const o of others){
      const ox = o.offsetLeft, oy = o.offsetTop;
      const cands = [[ox+s, oy], [ox-s, oy], [ox, oy+s], [ox, oy-s]];   // みぎ・ひだり・した・うえ
      for (const c of cands){
        const cx = c[0], cy = c[1];
        const d = Math.hypot(x - cx, y - cy);
        if (d < bestD && !slotTaken(cx, cy, s, el)){ bestD = d; best = {x:cx, y:cy}; }
      }
    }
    return best;
  }

  /* ----- 「10」ラベルの いち(かたまりの まんなか) ----- */
  function positionLabel(gid){
    const members = groupMembers(gid);
    if (!members.length) return;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    members.forEach(m => {
      const l=m.offsetLeft, t=m.offsetTop, w=m.offsetWidth, h=m.offsetHeight;
      minX=Math.min(minX,l); minY=Math.min(minY,t);
      maxX=Math.max(maxX,l+w); maxY=Math.max(maxY,t+h);
    });
    const label = document.querySelector('.ten-label[data-group="'+gid+'"]');
    if (label){ label.style.left = ((minX+maxX)/2)+'px'; label.style.top = ((minY+maxY)/2)+'px'; }
  }
  function relayoutLabels(){ document.querySelectorAll('.ten-label').forEach(l => positionLabel(l.dataset.group)); }

  /* ----- 10こを その形のまま くっつける(黄色＋「10」) ----- */
  function lockGroup(members){
    const gid = 'g' + (groupSeq++);
    members.forEach(m => {
      m.classList.remove('blue');
      m.classList.add('grouped', 'lockpop');
      m.dataset.group = gid;
      m.addEventListener('animationend', () => m.classList.remove('lockpop'), {once:true});
    });
    const label = document.createElement('div');
    label.className = 'ten-label';
    label.textContent = '10';
    label.dataset.group = gid;
    board.appendChild(label);
    positionLabel(gid);
    updateCount();
  }

  /* ----- タップで かいじょ(バラバラに もどす) ----- */
  function releaseGroup(gid){
    groupMembers(gid).forEach(m => {
      m.classList.remove('grouped');
      m.classList.add('lockpop');
      delete m.dataset.group;
      m.addEventListener('animationend', () => m.classList.remove('lockpop'), {once:true});
    });
    const label = document.querySelector('.ten-label[data-group="'+gid+'"]');
    if (label) label.remove();
    updateCount();
  }

  /* ----- がめんサイズが かわったら ----- */
  function clampAllBlocks(){
    document.querySelectorAll('.block').forEach(b => {
      const w = b.offsetWidth, h = b.offsetHeight;
      let x = b.offsetLeft, y = b.offsetTop;
      const nx = Math.max(-w*0.3, Math.min(x, window.innerWidth  - w*0.5));
      const ny = Math.max(-h*0.3, Math.min(y, window.innerHeight - h*0.5));
      if (nx !== x) b.style.left = nx + 'px';
      if (ny !== y) b.style.top  = ny + 'px';
    });
    relayoutLabels();
  }
  window.addEventListener('resize', clampAllBlocks);
  window.addEventListener('orientationchange', () => setTimeout(clampAllBlocks, 300));

  /* ----- 1のブロックを ふやす(モード中は バラバラに) ----- */
  function addBlock(){
    const b = document.createElement('div');
    b.className = 'block pop';
    const idx = looseBlocks().length;
    const p = modeOn ? scatterPos(idx) : loosePos(idx);
    b.style.left = p.x + 'px';
    b.style.top  = p.y + 'px';
    board.appendChild(b);
    b.addEventListener('animationend', () => b.classList.remove('pop'), {once:true});
    hint.classList.add('gone');
    updateCount();
  }
  addBtn.addEventListener('click', addBlock);

  /* ----- 10こモード きりかえ ----- */
  modeBtn.addEventListener('click', () => {
    modeOn = !modeOn;
    modeBtn.classList.toggle('on', modeOn);
    modeBtn.setAttribute('aria-pressed', String(modeOn));
    if (!modeOn){
      document.querySelectorAll('.ten-label').forEach(l => releaseGroup(l.dataset.group));
    }
  });

  /* ===== ドラッグ(マウス・ゆび どちらも) ===== */
  let drag = null;

  board.addEventListener('pointerdown', e => {
    const el = e.target.closest('.block');
    if (!el || el.classList.contains('gobble')) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);

    if (el.classList.contains('grouped')){
      const gid = el.dataset.group;
      const members = groupMembers(gid);
      const label = document.querySelector('.ten-label[data-group="'+gid+'"]');
      drag = {
        type:'group', gid, members, label,
        startX:e.clientX, startY:e.clientY, moved:false,
        starts: members.map(m => ({el:m, l:m.offsetLeft, t:m.offsetTop})),
        labelStart: label ? {l:label.offsetLeft, t:label.offsetTop} : null
      };
      members.forEach(m => m.classList.add('dragging'));
    } else {
      drag = {
        type:'single', el,
        startX:e.clientX, startY:e.clientY, moved:false,
        offX:e.clientX - el.offsetLeft, offY:e.clientY - el.offsetTop
      };
      el.classList.add('dragging');
    }
  });

  board.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) drag.moved = true;
    if (!drag.moved) return;

    if (drag.type === 'group'){
      drag.starts.forEach(st => { st.el.style.left = (st.l+dx)+'px'; st.el.style.top = (st.t+dy)+'px'; });
      if (drag.label){ drag.label.style.left = (drag.labelStart.l+dx)+'px'; drag.label.style.top = (drag.labelStart.t+dy)+'px'; }
      trash.classList.toggle('hot', pointerOverTrash(e));
    } else {
      const w = drag.el.offsetWidth, h = drag.el.offsetHeight;
      let x = e.clientX - drag.offX, y = e.clientY - drag.offY;
      x = Math.max(-w*0.3, Math.min(x, window.innerWidth  - w*0.7));
      y = Math.max(-h*0.3, Math.min(y, window.innerHeight - h*0.7));
      if (!overTrash(drag.el, e)){
        const snap = magnetSnap(drag.el, x, y);   // 磁石で ピタッと(モードに かんけいなく)
        if (snap){ x = snap.x; y = snap.y; }
      }
      drag.el.style.left = x + 'px';
      drag.el.style.top  = y + 'px';
      trash.classList.toggle('hot', overTrash(drag.el, e));
    }
  });

  function endDrag(e){
    if (!drag) return;
    trash.classList.remove('hot');

    if (drag.type === 'group'){
      drag.members.forEach(m => m.classList.remove('dragging'));
      if (drag.moved && pointerOverTrash(e)){
        if (drag.label) drag.label.remove();
        drag.members.forEach(m => {
          m.classList.add('gobble');
          m.addEventListener('animationend', () => { m.remove(); updateCount(); }, {once:true});
        });
        updateCount();
      } else if (!drag.moved){
        releaseGroup(drag.gid);            // タップ → かいじょ
      }
    } else {
      const b = drag.el;
      b.classList.remove('dragging');
      if (drag.moved && overTrash(b, e)){
        b.classList.add('gobble');
        b.addEventListener('animationend', () => { b.remove(); updateCount(); }, {once:true});
        updateCount();
      } else if (!drag.moved){
        b.classList.toggle('blue');        // タップ → いろがえ
      } else if (modeOn){
        const comp = componentOf(b);       // うごかした先で 10こ くっついた？
        if (comp.length >= 10) lockGroup(comp.slice(0, 10));
      }
    }
    drag = null;
  }
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', endDrag);

  function overTrash(b, e){
    const t = trash.getBoundingClientRect();
    const r = b.getBoundingClientRect();
    const pad = 6;
    const hit = r.right > t.left - pad && r.left < t.right + pad &&
                r.bottom > t.top - pad && r.top < t.bottom + pad;
    return hit || pointerOverTrash(e);
  }
  function pointerOverTrash(e){
    if (!e) return false;
    const t = trash.getBoundingClientRect();
    const pad = 6;
    return e.clientX > t.left - pad && e.clientX < t.right + pad &&
           e.clientY > t.top  - pad && e.clientY < t.bottom + pad;
  }

  /* ----- かずを かくす/みせる ----- */
  eyeBtn.addEventListener('click', () => {
    countVisible = !countVisible;
    eyeBtn.textContent = countVisible ? '👀' : '🙈';
    counter.classList.toggle('hidden-num', !countVisible);
    updateCount();
  });

  /* ----- ぜんぶ けす(2かい おして かくにん) ----- */
  clearBtn.addEventListener('click', () => {
    if (!clearArmed){
      clearArmed = true;
      clearBtn.textContent = 'ほんとに けす？';
      clearBtn.classList.add('confirm');
      clearTimer = setTimeout(resetClearBtn, 2500);
      return;
    }
    clearTimeout(clearTimer);
    document.querySelectorAll('.block').forEach(b => b.remove());
    document.querySelectorAll('.ten-label').forEach(l => l.remove());
    updateCount();
    hint.classList.remove('gone');
    resetClearBtn();
  });
  function resetClearBtn(){
    clearArmed = false;
    clearBtn.textContent = 'ぜんぶ けす';
    clearBtn.classList.remove('confirm');
  }

  document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});

  updateCount();
})();
</script>
</body>
</html>
